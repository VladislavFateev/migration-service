server:
  port: 8085

spring:
  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 500MB
  jpa:
    show-sql: true
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5439/postgres?currentSchema=migration_schema
    username: postgres
    password: password
  liquibase:
    change-log: "classpath:/db/changelog/db.changelog-master.xml"

import:
  file:
    path: ../mnt
export:
